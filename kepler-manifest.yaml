apiVersion: v1
kind: Namespace
metadata:
  name: kepler
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kepler
  namespace: kepler
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kepler
rules:
- apiGroups: [""]
  resources: ["nodes", "nodes/metrics", "nodes/proxy", "pods", "namespaces"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["daemonsets", "deployments", "statefulsets", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kepler
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kepler
subjects:
- kind: ServiceAccount
  name: kepler
  namespace: kepler
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kepler
  namespace: kepler
data:
  config.yaml: |
    cpu:
      preferredMeters:
      - rapl
      - hwmon
      - fake
    debug:
      pprof:
        enabled: false
    dev:
      fake-cpu-meter:
        enabled: false
        zones: []
    exporter:
      prometheus:
        enabled: true
    host:
      procfs: /host/proc
      sysfs: /host/sys
    kube:
      enabled: false
      nodeName: ""
      podInformer:
        mode: kubelet
        pollInterval: 15s
    log:
      format: text
      level: debug
    web:
      listenAddresses:
      - :28282
---
apiVersion: v1
kind: Service
metadata:
  name: kepler
  namespace: kepler
  labels:
    app.kubernetes.io/name: kepler
spec:
  type: ClusterIP
  ports:
  - port: 28282
    targetPort: 28282
    name: http
    protocol: TCP
  selector:
    app.kubernetes.io/name: kepler
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kepler
  namespace: kepler
  labels:
    app.kubernetes.io/name: kepler
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kepler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kepler
    spec:
      serviceAccountName: kepler
      hostPID: true
      containers:
      - name: kepler
        image: quay.io/sustainable_computing_io/kepler:v0.12.0
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        command:
        - /usr/bin/kepler
        args:
        - --config.file=/etc/kepler/config.yaml
        env:
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        ports:
        - containerPort: 28282
          name: http
        volumeMounts:
        - name: sysfs
          mountPath: /host/sys
          readOnly: true
        - name: procfs
          mountPath: /host/proc
          readOnly: true
        - name: cfm
          mountPath: /etc/kepler
      volumes:
      - name: sysfs
        hostPath:
          path: /sys
      - name: procfs
        hostPath:
          path: /proc
      - name: cfm
        configMap:
          name: kepler
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      - effect: NoSchedule
        key: node-role.kubernetes.io/master
        operator: Exists
